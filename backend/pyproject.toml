[project]
name = "smartcredit-backend"
version = "0.2.0"
description = "Smart Credit backend — соединяет frontend и ml"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "bcrypt>=4.2",
    "python-jose[cryptography]>=3.3",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
