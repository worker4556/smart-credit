components:
  schemas:
    Account:
      properties:
        business_debt:
          default: 0
          description: Текущий долг бизнеса по кредитам, ₽
          minimum: 0.0
          title: Business Debt
          type: integer
        business_monthly_payments:
          default: 0
          minimum: 0.0
          title: Business Monthly Payments
          type: integer
        external_turnover_monthly:
          anyOf:
          - items:
              type: integer
            maxItems: 12
            type: array
          - type: 'null'
          description: Поступления по выписке другого банка (подтверждённые), по месяцам
          title: External Turnover Monthly
        rko_months:
          description: Сколько месяцев счёт в Альфе
          minimum: 0.0
          title: Rko Months
          type: integer
        turnover_monthly:
          description: Чистые поступления по счёту в Альфе по месяцам, от старых к
            новым
          items:
            type: integer
          maxItems: 12
          minItems: 1
          title: Turnover Monthly
          type: array
      required:
      - turnover_monthly
      - rko_months
      title: Account
      type: object
    AmountRange:
      properties:
        high:
          title: High
          type: integer
        low:
          title: Low
          type: integer
      required:
      - low
      - high
      title: AmountRange
      type: object
    Applicant:
      properties:
        account:
          $ref: '#/components/schemas/Account'
        checks:
          $ref: '#/components/schemas/Checks'
          default:
            disputed: false
            mismatch_unresolved: false
            missing_documents: []
        company:
          $ref: '#/components/schemas/Company'
        owner:
          $ref: '#/components/schemas/Owner'
        request:
          $ref: '#/components/schemas/LoanRequest'
      required:
      - request
      - company
      - account
      - owner
      title: Applicant
      type: object
    AssistantAnswer:
      properties:
        answer:
          title: Answer
          type: string
        fallback_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Fallback Reason
        source:
          enum:
          - LLM
          - TEMPLATE
          title: Source
          type: string
        template_answer:
          title: Template Answer
          type: string
        terms:
          default: []
          items:
            type: string
          title: Terms
          type: array
        topic:
          enum:
          - WHY
          - WHAT_TO_DO
          - WHEN
          - TERM
          - AMOUNT
          - OFF_TOPIC
          - NONCREDIT
          - NOT_NEEDED
          title: Topic
          type: string
      required:
      - answer
      - template_answer
      - source
      - topic
      title: AssistantAnswer
      type: object
    AssistantContext:
      properties:
        decision:
          anyOf:
          - $ref: '#/components/schemas/Decision'
          - type: 'null'
        route:
          anyOf:
          - $ref: '#/components/schemas/Route'
          - type: 'null'
      title: AssistantContext
      type: object
    AssistantRequest:
      properties:
        context:
          $ref: '#/components/schemas/AssistantContext'
        question:
          examples:
          - почему мне отказали?
          maxLength: 500
          minLength: 1
          title: Question
          type: string
        use_llm:
          default: true
          title: Use Llm
          type: boolean
      required:
      - question
      - context
      title: AssistantRequest
      type: object
    Checks:
      properties:
        declared_monthly_revenue:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          description: Выручка в месяц со слов клиента
          title: Declared Monthly Revenue
        disputed:
          default: false
          description: Клиент нажал «Не согласен с причиной»
          title: Disputed
          type: boolean
        mismatch_unresolved:
          default: false
          description: Расхождение не устранено после одного запроса
          title: Mismatch Unresolved
          type: boolean
        missing_documents:
          default: []
          items:
            type: string
          title: Missing Documents
          type: array
      title: Checks
      type: object
    Company:
      properties:
        bankruptcy:
          default: false
          title: Bankruptcy
          type: boolean
        business_age_months:
          minimum: 0.0
          title: Business Age Months
          type: integer
        fns_blocked:
          default: false
          title: Fns Blocked
          type: boolean
        fssp_debt:
          default: 0
          description: Открытые исполнительные производства, ₽
          minimum: 0.0
          title: Fssp Debt
          type: integer
        legal_form:
          enum:
          - IP
          - OOO
          title: Legal Form
          type: string
        measures_115fz:
          default: false
          title: Measures 115Fz
          type: boolean
        okved:
          examples:
          - '56.10'
          title: Okved
          type: string
        recovery_lawsuit:
          default: false
          description: Иск о взыскании (арбитраж)
          title: Recovery Lawsuit
          type: boolean
        status:
          default: ACTIVE
          description: ЕГРЮЛ/ЕГРИП
          enum:
          - ACTIVE
          - LIQUIDATING
          - LIQUIDATED
          title: Status
          type: string
        tax_debt:
          default: 0
          description: ФНС «Прозрачный бизнес», ₽
          minimum: 0.0
          title: Tax Debt
          type: integer
        zsk_level:
          anyOf:
          - enum:
            - GREEN
            - YELLOW
            - RED
            type: string
          - type: 'null'
          description: Известен только после подачи (Б2)
          title: Zsk Level
      required:
      - legal_form
      - okved
      - business_age_months
      title: Company
      type: object
    Cost:
      properties:
        amount:
          title: Amount
          type: integer
        fee:
          title: Fee
          type: integer
        full_cost:
          description: 'Полная стоимость в рублях: проценты + комиссия (для овердрафта
            — за год)'
          title: Full Cost
          type: integer
        monthly_payment:
          description: Кредит — аннуитет; овердрафт — проценты за месяц при полном
            использовании
          title: Monthly Payment
          type: integer
        product:
          enum:
          - WORKING_CAPITAL
          - OVERDRAFT
          title: Product
          type: string
        rate:
          title: Rate
          type: number
        term_months:
          title: Term Months
          type: integer
      required:
      - product
      - amount
      - term_months
      - rate
      - monthly_payment
      - fee
      - full_cost
      title: Cost
      type: object
    Decision:
      properties:
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
        cost:
          anyOf:
          - $ref: '#/components/schemas/Cost'
          - type: 'null'
        limit:
          anyOf:
          - $ref: '#/components/schemas/LimitResult'
          - type: 'null'
        outcome:
          enum:
          - APPROVED
          - COUNTER_OFFER
          - INFO_REQUESTED
          - REJECTED
          - SUSPENDED_115FZ
          title: Outcome
          type: string
        policy_version:
          title: Policy Version
          type: string
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          title: Reasons
          type: array
        requested_amount:
          title: Requested Amount
          type: integer
        score:
          $ref: '#/components/schemas/ScoreResult'
        specialist:
          $ref: '#/components/schemas/Specialist'
        term_months:
          anyOf:
          - type: integer
          - type: 'null'
          title: Term Months
        weather:
          anyOf:
          - $ref: '#/components/schemas/Weather'
          - type: 'null'
          description: Только когда в решении есть сумма
      required:
      - policy_version
      - outcome
      - requested_amount
      - amount
      - term_months
      - cost
      - limit
      - reasons
      - specialist
      - score
      title: Decision
      type: object
    DecisionWithOffers:
      properties:
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
        cost:
          anyOf:
          - $ref: '#/components/schemas/Cost'
          - type: 'null'
        limit:
          anyOf:
          - $ref: '#/components/schemas/LimitResult'
          - type: 'null'
        offers:
          items:
            $ref: '#/components/schemas/Offer'
          title: Offers
          type: array
        outcome:
          enum:
          - APPROVED
          - COUNTER_OFFER
          - INFO_REQUESTED
          - REJECTED
          - SUSPENDED_115FZ
          title: Outcome
          type: string
        policy_version:
          title: Policy Version
          type: string
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          title: Reasons
          type: array
        requested_amount:
          title: Requested Amount
          type: integer
        score:
          $ref: '#/components/schemas/ScoreResult'
        specialist:
          $ref: '#/components/schemas/Specialist'
        term_months:
          anyOf:
          - type: integer
          - type: 'null'
          title: Term Months
        weather:
          anyOf:
          - $ref: '#/components/schemas/Weather'
          - type: 'null'
          description: Только когда в решении есть сумма
      required:
      - policy_version
      - outcome
      - requested_amount
      - amount
      - term_months
      - cost
      - limit
      - reasons
      - specialist
      - score
      - offers
      title: DecisionWithOffers
      type: object
    ExplainRequest:
      properties:
        decision:
          anyOf:
          - $ref: '#/components/schemas/Decision'
          - type: 'null'
        precheck:
          anyOf:
          - $ref: '#/components/schemas/Precheck'
          - type: 'null'
        route:
          anyOf:
          - $ref: '#/components/schemas/Route'
          - type: 'null'
        use_llm:
          default: true
          title: Use Llm
          type: boolean
      title: ExplainRequest
      type: object
    Explanation:
      properties:
        fallback_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Fallback Reason
        source:
          title: Source
          type: string
        template_text:
          title: Template Text
          type: string
        text:
          title: Text
          type: string
      required:
      - text
      - template_text
      - source
      title: Explanation
      type: object
    FactorScore:
      properties:
        factor:
          title: Factor
          type: string
        label:
          title: Label
          type: string
        layer:
          enum:
          - BUSINESS
          - OWNER
          title: Layer
          type: string
        max_points:
          title: Max Points
          type: integer
        points:
          title: Points
          type: integer
        reason_code:
          title: Reason Code
          type: string
        shortfall:
          title: Shortfall
          type: integer
        value:
          anyOf:
          - type: number
          - type: integer
          - type: string
          - type: 'null'
          title: Value
      required:
      - factor
      - label
      - layer
      - reason_code
      - value
      - points
      - max_points
      - shortfall
      title: FactorScore
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Intent:
      properties:
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
        missing:
          items:
            type: string
          title: Missing
          type: array
        needs_confirmation:
          default: true
          title: Needs Confirmation
          type: boolean
        product:
          anyOf:
          - enum:
            - WORKING_CAPITAL
            - OVERDRAFT
            type: string
          - type: 'null'
          title: Product
        product_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Reason
        purpose:
          anyOf:
          - enum:
            - PURCHASE
            - CASH_GAP
            - CONTRACT
            - EQUIPMENT
            - EXPANSION
            - OTHER
            type: string
          - type: 'null'
          title: Purpose
        purpose_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose Text
        source:
          enum:
          - RULES
          - LLM
          title: Source
          type: string
        term_months:
          anyOf:
          - type: integer
          - type: 'null'
          title: Term Months
      required:
      - purpose
      - purpose_text
      - amount
      - term_months
      - product
      - product_reason
      - missing
      - source
      title: Intent
      type: object
    IntentRequest:
      properties:
        text:
          examples:
          - нужно 800 тыс. на закупку к сезону
          maxLength: 500
          minLength: 1
          title: Text
          type: string
        use_llm:
          default: true
          title: Use Llm
          type: boolean
      required:
      - text
      title: IntentRequest
      type: object
    LimitResult:
      properties:
        binding:
          enum:
          - TURNOVER
          - DEBT
          - PAYMENT
          - PRODUCT_MAX
          title: Binding
          type: string
        components:
          additionalProperties:
            type: integer
          title: Components
          type: object
        limit:
          title: Limit
          type: integer
        product:
          enum:
          - WORKING_CAPITAL
          - OVERDRAFT
          title: Product
          type: string
      required:
      - product
      - limit
      - binding
      - components
      title: LimitResult
      type: object
    LoanRequest:
      properties:
        amount:
          description: Желаемая сумма («вершина»), ₽
          exclusiveMinimum: 0.0
          title: Amount
          type: integer
        has_guarantor:
          default: false
          description: Владелец — поручитель (для ООО)
          title: Has Guarantor
          type: boolean
        product:
          enum:
          - WORKING_CAPITAL
          - OVERDRAFT
          title: Product
          type: string
        term_months:
          anyOf:
          - maximum: 60.0
            minimum: 1.0
            type: integer
          - type: 'null'
          description: Для овердрафта не нужен — 12 мес
          title: Term Months
      required:
      - product
      - amount
      title: LoanRequest
      type: object
    Offer:
      properties:
        amount:
          title: Amount
          type: integer
        cost:
          $ref: '#/components/schemas/Cost'
        kind:
          enum:
          - REQUESTED
          - WITHIN_ESTIMATE
          - OTHER_TERM
          - OTHER_PRODUCT
          title: Kind
          type: string
        product:
          enum:
          - WORKING_CAPITAL
          - OVERDRAFT
          title: Product
          type: string
        term_months:
          title: Term Months
          type: integer
        weather:
          anyOf:
          - $ref: '#/components/schemas/Weather'
          - type: 'null'
      required:
      - kind
      - product
      - amount
      - term_months
      - cost
      title: Offer
      type: object
    Owner:
      properties:
        card_utilization:
          anyOf:
          - maximum: 5.0
            minimum: 0.0
            type: number
          - type: 'null'
          description: Использование лимитов кредиток, доля
          title: Card Utilization
        current_overdue:
          default: false
          title: Current Overdue
          type: boolean
        had_overdue_2y:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'Ответ клиента: были ли просрочки за 2 года'
          title: Had Overdue 2Y
        max_dpd_24m:
          default: 0
          description: Макс. просрочка за 24 мес, дней (БКИ)
          minimum: 0.0
          title: Max Dpd 24M
          type: integer
        months_since_90plus:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          description: Сколько месяцев назад закрыт последний эпизод 90+ (БКИ)
          title: Months Since 90Plus
        personal_monthly_payments:
          default: 0
          minimum: 0.0
          title: Personal Monthly Payments
          type: integer
        source:
          description: До подачи — со слов клиента, после Б2 — из БКИ
          enum:
          - SELF_REPORTED
          - BKI
          title: Source
          type: string
      required:
      - source
      title: Owner
      type: object
    PaymentRow:
      properties:
        balance:
          title: Balance
          type: integer
        interest:
          title: Interest
          type: integer
        month:
          title: Month
          type: integer
        payment:
          title: Payment
          type: integer
        principal:
          title: Principal
          type: integer
      required:
      - month
      - payment
      - principal
      - interest
      - balance
      title: PaymentRow
      type: object
    Precheck:
      properties:
        amount_range:
          $ref: '#/components/schemas/AmountRange'
          description: «Высота» — вилка доступной суммы
        chance:
          enum:
          - HIGH
          - MEDIUM
          - LOW
          title: Chance
          type: string
        cost:
          anyOf:
          - $ref: '#/components/schemas/Cost'
          - type: 'null'
          description: Полная стоимость на запрошенную сумму
        disclaimer:
          title: Disclaimer
          type: string
        expected_outcome:
          enum:
          - APPROVED
          - COUNTER_OFFER
          - INFO_REQUESTED
          - REJECTED
          - SUSPENDED_115FZ
          title: Expected Outcome
          type: string
        offers:
          items:
            $ref: '#/components/schemas/Offer'
          title: Offers
          type: array
        owner_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Note
        policy_version:
          title: Policy Version
          type: string
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          title: Reasons
          type: array
        requested_amount:
          description: «Вершина»
          title: Requested Amount
          type: integer
        score:
          title: Score
          type: integer
        valid_days:
          title: Valid Days
          type: integer
        weather:
          anyOf:
          - $ref: '#/components/schemas/Weather'
          - type: 'null'
      required:
      - policy_version
      - chance
      - expected_outcome
      - score
      - amount_range
      - requested_amount
      - cost
      - reasons
      - offers
      - owner_note
      - valid_days
      - disclaimer
      title: Precheck
      type: object
    Projection:
      properties:
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
        available_amount:
          title: Available Amount
          type: integer
        cost:
          anyOf:
          - $ref: '#/components/schemas/Cost'
          - type: 'null'
        limit:
          title: Limit
          type: integer
        outcome:
          title: Outcome
          type: string
        score:
          title: Score
          type: integer
      required:
      - score
      - limit
      - available_amount
      - outcome
      - amount
      - cost
      title: Projection
      type: object
    Quote:
      properties:
        amount:
          title: Amount
          type: integer
        fee:
          title: Fee
          type: integer
        full_cost:
          description: 'Полная стоимость в рублях: проценты + комиссия'
          title: Full Cost
          type: integer
        interest:
          title: Interest
          type: integer
        monthly_payment:
          description: Кредит — аннуитет; овердрафт — проценты за месяц при полном
            использовании
          title: Monthly Payment
          type: integer
        note:
          title: Note
          type: string
        product:
          enum:
          - WORKING_CAPITAL
          - OVERDRAFT
          title: Product
          type: string
        rate:
          title: Rate
          type: number
        schedule:
          description: График платежей; для овердрафта пустой
          items:
            $ref: '#/components/schemas/PaymentRow'
          title: Schedule
          type: array
        term_months:
          title: Term Months
          type: integer
        total_paid:
          description: Всего вернёте банку (для овердрафта — за год при полном использовании)
          title: Total Paid
          type: integer
      required:
      - product
      - amount
      - term_months
      - rate
      - monthly_payment
      - total_paid
      - interest
      - fee
      - full_cost
      - schedule
      - note
      title: Quote
      type: object
    QuoteRequest:
      properties:
        amount:
          exclusiveMinimum: 0.0
          title: Amount
          type: integer
        product:
          enum:
          - WORKING_CAPITAL
          - OVERDRAFT
          title: Product
          type: string
        term_months:
          anyOf:
          - maximum: 60.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Term Months
      required:
      - product
      - amount
      title: QuoteRequest
      type: object
    Reason:
      properties:
        category:
          title: Category
          type: string
        code:
          title: Code
          type: string
        kind:
          title: Kind
          type: string
        shortfall:
          anyOf:
          - type: integer
          - type: 'null'
          title: Shortfall
        text:
          title: Text
          type: string
      required:
      - code
      - kind
      - category
      - text
      title: Reason
      type: object
    Route:
      properties:
        advice:
          items:
            type: string
          title: Advice
          type: array
        based_on:
          default: SYSTEM
          enum:
          - SYSTEM
          - SPECIALIST
          title: Based On
          type: string
        current_available_amount:
          title: Current Available Amount
          type: integer
        current_score:
          title: Current Score
          type: integer
        disclaimer:
          title: Disclaimer
          type: string
        holds:
          enum:
          - NONE
          - SCORE
          - STOP
          - TIME_WINDOW
          - TURNOVER
          - STOP_PERMANENT
          - NONCREDIT
          title: Holds
          type: string
        horizon_months:
          anyOf:
          - type: number
          - type: 'null'
          title: Horizon Months
        horizon_text:
          title: Horizon Text
          type: string
        message:
          title: Message
          type: string
        policy_version:
          title: Policy Version
          type: string
        projection:
          anyOf:
          - $ref: '#/components/schemas/Projection'
          - type: 'null'
        reachable:
          title: Reachable
          type: boolean
        status:
          enum:
          - ACTIVE
          - READY
          - NO_ROUTE
          title: Status
          type: string
        steps:
          items:
            $ref: '#/components/schemas/RouteStep'
          title: Steps
          type: array
        target_amount:
          title: Target Amount
          type: integer
        time_gain_points:
          title: Time Gain Points
          type: integer
      required:
      - policy_version
      - status
      - holds
      - target_amount
      - current_score
      - current_available_amount
      - steps
      - time_gain_points
      - horizon_months
      - horizon_text
      - reachable
      - projection
      - advice
      - message
      - disclaimer
      title: Route
      type: object
    RouteRequest:
      properties:
        applicant:
          $ref: '#/components/schemas/Applicant'
        assume_done:
          default: []
          description: Коды шагов, которые клиент отметил выполненными (прогноз)
          items:
            type: string
          title: Assume Done
          type: array
        specialist_decision:
          anyOf:
          - $ref: '#/components/schemas/SpecialistDecision'
          - type: 'null'
          description: 'Путь G: маршрут от решения специалиста'
      required:
      - applicant
      title: RouteRequest
      type: object
    RouteStep:
      properties:
        action:
          title: Action
          type: string
        bki_delay_business_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bki Delay Business Days
        code:
          title: Code
          type: string
        kind:
          enum:
          - STOP
          - FACTOR
          - TIME_WINDOW
          - WAIT
          - TURNOVER
          title: Kind
          type: string
        months:
          anyOf:
          - type: number
          - type: 'null'
          title: Months
        points_gain:
          anyOf:
          - type: integer
          - type: 'null'
          title: Points Gain
        target_turnover:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Turnover
        term:
          title: Term
          type: string
      required:
      - code
      - kind
      - action
      - term
      - months
      title: RouteStep
      type: object
    ScoreResult:
      properties:
        factors:
          items:
            $ref: '#/components/schemas/FactorScore'
          title: Factors
          type: array
        max_score:
          default: 100
          title: Max Score
          type: integer
        owner_source:
          title: Owner Source
          type: string
        policy_version:
          title: Policy Version
          type: string
        score:
          title: Score
          type: integer
        stops:
          items:
            $ref: '#/components/schemas/Stop'
          title: Stops
          type: array
        turnover_monthly_avg:
          description: Средний подтверждённый оборот за 6 мес, ₽
          title: Turnover Monthly Avg
          type: integer
      required:
      - policy_version
      - score
      - owner_source
      - factors
      - stops
      - turnover_monthly_avg
      title: ScoreResult
      type: object
    Specialist:
      properties:
        required:
          title: Required
          type: boolean
        triggers:
          items:
            type: string
          title: Triggers
          type: array
      required:
      - required
      - triggers
      title: Specialist
      type: object
    SpecialistDecision:
      description: 'Итоговое решение специалиста (путь G): маршрут строится от него,
        а не от рекомендации системы.'
      properties:
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
        outcome:
          enum:
          - APPROVED
          - COUNTER_OFFER
          - INFO_REQUESTED
          - REJECTED
          title: Outcome
          type: string
        reason_code:
          title: Reason Code
          type: string
      required:
      - outcome
      - reason_code
      title: SpecialistDecision
      type: object
    Stop:
      properties:
        code:
          title: Code
          type: string
        months_to_clear:
          anyOf:
          - type: number
          - type: 'null'
          description: 'Для временных окон: сколько ждать'
          title: Months To Clear
        permanent:
          default: false
          title: Permanent
          type: boolean
        text:
          title: Text
          type: string
      required:
      - code
      - text
      title: Stop
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Weather:
      description: '«Погода»: стоимость при неблагоприятных условиях. Иллюстрация,
        на решение не влияет.'
      properties:
        disclaimer:
          title: Disclaimer
          type: string
        rows:
          items:
            $ref: '#/components/schemas/WeatherRow'
          title: Rows
          type: array
      required:
      - rows
      - disclaimer
      title: Weather
      type: object
    WeatherRequest:
      properties:
        amount:
          exclusiveMinimum: 0.0
          title: Amount
          type: integer
        product:
          enum:
          - WORKING_CAPITAL
          - OVERDRAFT
          title: Product
          type: string
        rate:
          anyOf:
          - exclusiveMinimum: 0.0
            maximum: 100.0
            type: number
          - type: 'null'
          description: Ставка решения; по умолчанию — ставка продукта
          title: Rate
        term_months:
          anyOf:
          - maximum: 60.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Term Months
      required:
      - product
      - amount
      title: WeatherRequest
      type: object
    WeatherRow:
      properties:
        code:
          enum:
          - BASE
          - RATE_UP
          - OVERDUE_30
          title: Code
          type: string
        delta_full_cost:
          description: Насколько полная стоимость больше, чем в строке BASE
          title: Delta Full Cost
          type: integer
        full_cost:
          title: Full Cost
          type: integer
        monthly_payment:
          title: Monthly Payment
          type: integer
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        rate:
          title: Rate
          type: number
        title:
          title: Title
          type: string
      required:
      - code
      - title
      - rate
      - monthly_payment
      - full_cost
      - delta_full_cost
      title: WeatherRow
      type: object
