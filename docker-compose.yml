# Единый запуск всего проекта:  docker compose up --build  →  http://localhost:3000
# Сервисы: frontend (nginx) → backend → ml → llm. Бэкенд и postgres добавляет бэкендер (docs/team/backend-instructions.md).
# LLM включена по умолчанию: при первом запуске llm скачивает модель (~1,4 ГБ), пока она качается — ml отвечает шаблонами
# (GET ml:8001/health → llm.ready = false), потом помощник включается сам. Подробно — llm/README.md.
# Отключить LLM: OLLAMA_URL= в .env. На Mac для разработки быстрее нативная Ollama: OLLAMA_URL=http://host.docker.internal:11434
services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    restart: unless-stopped

  ml:
    build: ./ml
    ports: ["8001:8001"]
    environment:
      OLLAMA_URL: ${OLLAMA_URL-http://llm:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      LLM_TEXT_TIMEOUT_SECONDS: ${LLM_TEXT_TIMEOUT_SECONDS:-30}
      LLM_INTENT_TIMEOUT_SECONDS: ${LLM_INTENT_TIMEOUT_SECONDS:-15}
    restart: unless-stopped
    # без depends_on на llm: ml стартует сразу и не ждёт модель

  # Локальная LLM с открытыми весами (Ollama + qwen3:1.7b): сама качает и прогревает модель — llm/README.md
  llm:
    build: ./llm
    ports: ["11434:11434"]
    volumes: ["llm-models:/root/.ollama"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
    mem_limit: 6g
    restart: unless-stopped

volumes:
  llm-models:
