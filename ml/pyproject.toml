[project]
name = "smart-credit-ml"
version = "2.0.0"
description = "Approval engine for Smart Credit: scoring, decision rules, precheck, route to approval, local LLM helpers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=8.3",
    "scikit-learn>=1.9.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
