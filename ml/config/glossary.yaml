# Словарь простых слов. Источник 15 терминов — «Макет заявки и предложения банка», раздел 4: поле plain дословно
# («как пишем в интерфейсе»). Остальные термины — из наших текстов (решения, маршрут, «Погода»), в том же стиле.
# aliases — основы слов: термин находится, если каждое слово текста начинается с соответствующей основы
# («овердрафт» находит «овердрафта», «долгов нагрузк» — «долговой нагрузки»).
# Правило текстов: не пишем «ПСК» — пишем «полная стоимость в рублях». Термин «ПСК» есть, потому что клиент может спросить.
terms:
  - term: Оборотные средства
    aliases: [оборотн средств]
    plain: Деньги на текущие расходы
    more: Деньги, которые крутятся в бизнесе каждый день — на закупки, зарплаты, аренду и налоги. Кредит на оборотные средства помогает не останавливать работу, пока деньги от клиентов ещё не пришли.
  - term: Кассовый разрыв
    aliases: [кассов разрыв]
    plain: Когда деньги нужны сейчас, а клиенты ещё не заплатили
    more: Платить поставщикам или сотрудникам нужно сегодня, а оплата от покупателей придёт позже. Короткий разрыв удобно закрывать овердрафтом.
  - term: Овердрафт
    aliases: [овердрафт]
    plain: Деньги сверх остатка на счёте. Платите только за дни, когда они взяты
    more: Банк разрешает уйти в минус на счёте до установленного лимита. Поступления на счёт сами гасят долг, а проценты начисляются только на взятую сумму и только за дни пользования.
  - term: Кредитная линия
    aliases: [кредитн лини]
    plain: Деньги частями, когда нужно
    more: Банк открывает лимит, а вы берёте из него деньги по мере надобности. Платите только за то, что взяли; погашенная часть снова становится доступной.
  - term: Залог, обеспечение
    aliases: [залог, обеспечени]
    plain: Что можно оставить банку, если понадобится
    more: Имущество, которое подстраховывает кредит, — например, оборудование или недвижимость. В нашем демо-кабинете залог не требуется.
  - term: Поручитель
    aliases: [поручител, поручительств]
    plain: Тот, кто отвечает вместе с вами
    more: Человек, который обещает банку погасить долг, если компания не сможет. У ИП и небольших ООО поручителем обычно выступает сам владелец.
  - term: Выручка
    aliases: [выручк]
    plain: Сколько денег приходит от клиентов за год
    more: Все поступления от продаж до вычета расходов. Банк смотрит, насколько регулярно деньги поступают на счёт, — это один из главных факторов оценки.
  - term: ОКВЭД
    aliases: [оквэд]
    plain: Чем занимается ваш бизнес
    more: Код вида деятельности из реестра. По нему банк понимает отрасль, а отрасль немного влияет на оценку.
  - term: БКИ, кредитная история
    aliases: [бки, кредитн истори, бюро кредитных истори]
    plain: История ваших кредитов и платежей
    more: Бюро кредитных историй хранит сведения о ваших кредитах и о том, вовремя ли вы платили. Банк запрашивает её только после подачи заявки и вашего согласия. Данные в бюро обновляются примерно за 2 рабочих дня.
  - term: Аннуитетный платёж
    aliases: [аннуитет]
    plain: Одинаковая сумма каждый месяц
    more: Платёж не меняется весь срок кредита. В начале в нём больше процентов, к концу — больше погашения самого долга.
  - term: ПСК, переплата
    aliases: [пск, переплат]
    plain: Сколько всего вернёте банку и сколько из этого проценты
    more: Мы показываем это как полную стоимость в рублях — сколько вы заплатите сверх взятой суммы с учётом процентов и комиссии.
  - term: Ставка
    aliases: [ставк, процентн ставк]
    plain: Процент в год, который берёт банк
    more: Чем выше ставка, тем больше платёж и полная стоимость. Если оценка заявки ниже порога одобрения, ставка может быть выше базовой.
  - term: Скоринг
    aliases: [скоринг]
    plain: Оценка заявки
    more: Банк считает баллы по понятным факторам — регулярность оборотов, долговая нагрузка, возраст бизнеса и другие. Решение принимают правила банка с учётом этой оценки.
  - term: Долговая нагрузка
    aliases: [долгов нагрузк]
    plain: Какая часть дохода уходит на платежи по кредитам
    more: Чем больше доля платежей по уже взятым кредитам, тем меньше банк может дать сверху. Снизить нагрузку помогает погашение части кредитов или кредиток.
  - term: Реструктуризация
    aliases: [реструктуризац]
    plain: Изменить график платежей, если трудно платить
    more: Договорённость с банком о новом графике, например с меньшим платежом на более долгий срок. В демо-кабинете не реализована.
  - term: Полная стоимость в рублях
    aliases: [полн стоимост]
    plain: Сколько вы заплатите сверх взятой суммы
    more: Проценты за весь срок плюс комиссия. До решения банка это предварительный расчёт.
  - term: Предоценка
    aliases: [предоценк, предварительн оценк]
    plain: Оценка шансов до подачи заявки
    more: Считается по данным вашего счёта и ответам о себе, без запроса в бюро кредитных историй. Это не решение банка; оценка действует 30 дней.
  - term: Лимит
    aliases: [лимит]
    plain: Сколько банк может дать сейчас
    more: Сумма, которую позволяют обороты и текущие платежи бизнеса. Если лимит меньше желаемой суммы, банк предложит другие условия.
  - term: ЕНС
    aliases: [енс, един налогов сч]
    plain: Единый налоговый счёт — через него платятся налоги
    more: Если на нём долг больше 500 ₽, банк не может выдать кредит. Погасить долг можно за несколько недель.
  - term: ФССП
    aliases: [фссп, исполнительн производств, судебн пристав]
    plain: Судебные приставы и исполнительные производства
    more: Если по компании или владельцу открыто взыскание долга, это снижает оценку. Погашение долга по приставам убирает эту причину.
  - term: 115-ФЗ
    aliases: [115-фз, 115 фз]
    plain: Закон о противодействии отмыванию доходов
    more: Заявка приостановлена из-за проверки по 115-ФЗ. Это не оценка вашей кредитоспособности.
  - term: Вилка суммы
    aliases: [вилк сумм, вилк]
    plain: Диапазон суммы, на которую можно рассчитывать
    more: В предоценке мы показываем не точную сумму, а диапазон. Точная сумма появляется только в решении банка.
