# Готовые образы для жюри: GitHub сам собирает каждый сервис и публикует в GitHub Container Registry (ghcr.io).
# Жюри: docker compose pull && docker compose up — без сборки, npm, PyPI и скачивания модели.
# Образы под Windows/Linux (amd64) и Mac на Apple Silicon (arm64).
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ml, llm, frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли Dockerfile у сервиса
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Пропуск: нет ${{ matrix.service }}/Dockerfile"; fi

      - name: Освободить место на раннере (образ llm с моделью большой)
        if: steps.check.outputs.exists == 'true' && matrix.service == 'llm'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.exists == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'true'
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/worker4556/smart-credit-${{ matrix.service }}:latest
            ghcr.io/worker4556/smart-credit-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
